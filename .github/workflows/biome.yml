name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: latest
      - name: Run Biome lint
        # 只跑 linter，不跑格式检查：模板自带的 30 个文件未按 Biome 格式化，
        # 用 `biome ci` 会因纯排版问题卡住 CI，掩盖真正的代码问题。
        run: biome lint ./src --reporter=github
